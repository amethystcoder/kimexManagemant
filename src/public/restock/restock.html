<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restock Item</title>
    <link rel="stylesheet" href="restock.css">
    <script src="restock.js"></script>
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="relative flex size-full min-h-screen flex-col bg-white group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
          <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f2f4f1] px-10 py-3">
            <div class="flex items-center gap-4 text-[#131612]">
              <div class="size-4">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z"
                    fill="currentColor"
                  ></path>
                </svg>
              </div>
              <h2 class="text-[#131612] text-lg font-bold leading-tight tracking-[-0.015em]">StockWise</h2>
            </div>
            <div class="flex flex-1 justify-end gap-8">
              <button
                class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 bg-[#f2f4f1] text-[#131612] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5"
              >
                <div class="text-[#131612]" data-icon="Bell" data-size="20px" data-weight="regular">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                    <path
                      d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"
                    ></path>
                  </svg>
                </div>
              </button>
              <div
                class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBRsYcVWsw2j0oHGiVn0HImJFLpZvNEfLlWgEar7M0E4Y1eFXt2GSw5hg-F0qPjFRWR4jxF2ssiRGXWaUMf9nk2AuIe6LZO-9mSGQF37aFu7DeJj2DxsuKFrcSCXGzkrkMIb12FnSZRIYj37irYdkyFZZknmzjN44D8Sxl5FMoZsDj0xWLArvr86mxszlkzgjmQ2M0jakgCDEuHnFWGr2gJncyrp6rulW1ubatW079S14kW-emLUqiHDXjhPI069fabNTEHkEKJboY");'
              ></div>
            </div>
          </header>
          <div class="gap-1 px-6 flex flex-1 justify-center py-5">
            <div class="layout-content-container flex flex-col w-80">
              <div class="flex h-full min-h-[700px] flex-col justify-between bg-white p-4">
                <div class="flex flex-col gap-4">
                  <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3 px-3 py-2">
                      <div class="text-[#131612]" data-icon="Plus" data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                          <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path>
                        </svg>
                      </div>
                      <a href="../restock/restock.html" class="text-[#131612] text-sm font-medium leading-normal">Add Stock</a>
                    </div>
                    <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-[#f2f4f1]">
                      <div class="text-[#131612]" data-icon="Gauge" data-size="24px" data-weight="fill">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                          <path
                            d="M240,160v24a16,16,0,0,1-16,16H115.93a4,4,0,0,1-3.24-6.35L174.27,109a8.21,8.21,0,0,0-1.37-11.3,8,8,0,0,0-11.37,1.61l-72,99.06A4,4,0,0,1,86.25,200H32a16,16,0,0,1-16-16V161.13c0-1.79,0-3.57.13-5.33a4,4,0,0,1,4-3.8H48a8,8,0,0,0,8-8.53A8.17,8.17,0,0,0,47.73,136H23.92a4,4,0,0,1-3.87-5c12-43.84,49.66-77.13,95.52-82.28a4,4,0,0,1,4.43,4V80a8,8,0,0,0,8.53,8A8.17,8.17,0,0,0,136,79.73V52.67a4,4,0,0,1,4.43-4A112.18,112.18,0,0,1,236.23,131a4,4,0,0,1-3.88,5H208.27a8.17,8.17,0,0,0-8.25,7.47,8,8,0,0,0,8,8.53h27.92a4,4,0,0,1,4,3.86C240,157.23,240,158.61,240,160Z"
                          ></path>
                        </svg>
                      </div>
                      <p class="text-[#131612] text-sm font-medium leading-normal">Main Dashboard</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
              <div class="flex flex-wrap justify-between gap-3 p-4"><p class="text-[#131612] tracking-light text-[32px] font-bold leading-tight min-w-72">Inventory Overview</p></div>
              <div class="px-4 py-3">
                <label class="flex flex-col min-w-40 h-12 w-full">
                  <div class="flex w-full flex-1 items-stretch rounded-xl h-full">
                    <div
                      class="text-[#6f816a] flex border-none bg-[#f2f4f1] items-center justify-center pl-4 rounded-l-xl border-r-0"
                      data-icon="MagnifyingGlass"
                      data-size="24px"
                      data-weight="regular"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                        <path
                          d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
                        ></path>
                      </svg>
                    </div>
                    <input
                      placeholder="Search for items"
                      class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#131612] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f1] focus:border-none h-full placeholder:text-[#6f816a] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal"
                      value=""
                    />
                  </div>
                </label>
              </div>
              <section class="present-stock-cont">
                <h2>Present Stock</h2>
                <ul id="stock-list" class="contains-stock">
                    
                </ul>
            </section>
            <button type="button" onclick="showRestock()">Add New Stock</button>
            <button type="button" onclick="submitRestock()">Submit Restock</button>
            </div>
          </div>
        </div>
      </div>


      
    <div class="overlay-div inactive">
        <form id="restockForm" class="restock-form">
            <h1>Restock Item</h1>
            <span class="contains-input-area">
                <label for="productName">Product Name</label><br>
                <input type="text" id="productName" name="productName" placeholder="Product Name" required><br>
            </span>
            <span class="contains-input-area">
                <label for="productType">Product Type</label><br>
                <select id="productType" name="productType" required>
                    <option value="">Select type</option>
                    <option value="Frozen">Frozen</option>
                    <option value="Dry">Dry</option>
                </select><br>
            </span>
            <span class="contains-input-area">
                <label for="quantity">Quantity</label><br>
            <input type="number" id="quantity" name="quantity" placeholder="Quantity" required><br>
            </span>
            <span class="contains-input-area">
                <label for="expiryDate">Expiry Date</label><br>
            <input type="date" id="expiryDate" name="expiryDate" required><br>
            </span>
            <span class="contains-input-area">
                <label for="remarks">Remarks</label><br>
            <textarea id="remarks" name="remarks" placeholder="Remarks" rows="4" cols="50"></textarea><br>
            </span>
            <span class="button-options">
                <button type="submit">Add to Restock</button>
                <button type="button" class="close-btn" onclick="closeRestockForm()">Close</button>
            </span>
        </form>
    </div>
</body>
</html>
